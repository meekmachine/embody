name: Verify and publish package

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref or SHA to verify and publish (default: current ref)"
        required: false
        type: string
        default: ""
  repository_dispatch:
    types: [publish-pkg-pr-new]

concurrency:
  group: embody-package-${{ github.event.pull_request.number || github.event.client_payload.sha || github.event.inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Verify built package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CI: "true"
    steps:
      - name: Resolve source ref
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DISPATCH_SHA: ${{ github.event.client_payload.sha }}
          REQUESTED_REF: ${{ github.event.inputs.ref }}
        run: |
          set -euo pipefail
          case "${EVENT_NAME}" in
            pull_request)
              ref="${PR_HEAD_SHA}"
              ;;
            repository_dispatch)
              ref="${DISPATCH_SHA}"
              ;;
            workflow_dispatch)
              ref="${REQUESTED_REF:-${EVENT_SHA}}"
              ;;
            *)
              ref="${EVENT_SHA}"
              ;;
          esac
          if [[ -z "${ref}" ]]; then
            echo "A source ref or SHA is required for ${EVENT_NAME}." >&2
            exit 1
          fi
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"

      - name: Checkout source
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.source.outputs.ref }}

      - name: Reject tracked generated output
        run: npm run check:generated

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Restore Cargo build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: embody-package
          cache-on-failure: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test Rust
        run: npm run rust:test

      - name: Typecheck TypeScript
        run: npm run typecheck

      # This is the only build invocation. Every following step consumes dist/.
      - name: Build package once
        run: npm run build

      - name: Verify built exports and package contents
        run: npm run test:package

      - name: Publish immutable preview
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          args=(
            publish
            --commentWithSha
            --no-compact
            --previewVersion
            --no-template
          )
          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            args+=(--comment=off)
          fi
          npx --no-install pkg-pr-new "${args[@]}"
