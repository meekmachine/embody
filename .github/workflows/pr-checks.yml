name: Verify and publish package

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Preview ref/SHA; leave empty on main to publish a stable npm release"
        required: false
        type: string
        default: ""
      upstream_pr:
        description: "Optional PR number associated with an explicit preview ref"
        required: false
        type: string
        default: ""
  repository_dispatch:
    types: [publish-pkg-pr-new]

concurrency:
  # Serialize the entire stable release, including choosing its npm version.
  group: embody-${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.ref == '')) && 'npm-main' || format('preview-{0}', github.event.pull_request.number || github.event.client_payload.sha || inputs.ref || github.ref) }}
  cancel-in-progress: ${{ !(github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.ref == ''))) }}

permissions:
  contents: read
  pull-requests: write

jobs:
  package-source:
    name: Select preview or release source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_ref: ${{ steps.source.outputs.source_ref }}
      stable_release: ${{ steps.source.outputs.stable_release }}
    steps:
      # The requested preview may predate these helpers. Select its source
      # using this workflow's code, without npm or coordination credentials.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Test preview and release event policy
        run: node --test scripts/test/package-source.test.mjs
      - name: Select package source without reading npm publication state
        id: source
        run: node scripts/ci/package-source.mjs

  verify:
    name: Verify built package
    needs: package-source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      stable_release: ${{ needs.package-source.outputs.stable_release }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      release_commit: ${{ steps.release.outputs.release_commit }}
      source_sha: ${{ steps.revision.outputs.sha }}
    env:
      CARGO_INCREMENTAL: "0"
      CI: "true"
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.package-source.outputs.source_ref }}
          fetch-depth: 0

      - name: Record the checked-out source
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Reject tracked generated output
        run: npm run check:generated

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Restore Cargo build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: embody-package
          cache-on-failure: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test npm release version and source checks
        # Older source refs requested for preview may predate these helpers.
        if: hashFiles('scripts/test/npm-release.test.mjs') != ''
        run: node --test scripts/test/npm-release.test.mjs

      - name: Test package publication notifications
        if: hashFiles('scripts/test/package-publication.test.mjs') != ''
        run: node --test scripts/test/package-publication.test.mjs

      - name: Prepare stable npm version and source commit
        if: needs.package-source.outputs.stable_release == 'true'
        id: release
        run: node scripts/ci/determine-release-version.mjs

      - name: Test Rust
        run: npm run rust:test

      - name: Test character asset service worker
        run: npm run test:service-worker

      # This is the only build invocation. Every following step consumes dist/.
      # wasm-bindgen declarations must exist before checking the typed loader.
      - name: Build package once
        run: npm run build

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Verify built exports and package contents
        run: npm run test:package

      - name: Publish immutable preview
        if: needs.package-source.outputs.stable_release != 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          args=(
            publish
            --commentWithSha
            --no-compact
            --previewVersion
            --no-template
          )
          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            args+=(--comment=off)
          fi
          npx --no-install pkg-pr-new "${args[@]}"

      - name: Pack the verified npm release
        if: needs.package-source.outputs.stable_release == 'true'
        run: |
          mkdir release-package
          npm pack --pack-destination release-package

      - name: Upload the verified npm tarball
        if: needs.package-source.outputs.stable_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: npm-release-${{ github.sha }}
          path: release-package/*.tgz
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish-npm:
    name: Publish verified package to npm
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.ref == '')) && needs.verify.outputs.stable_release == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.verify.outputs.release_commit }}

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@v4
        with:
          name: npm-release-${{ github.sha }}
          path: release-package

      - name: Publish the tarball without rebuilding
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_KEY }}
          RELEASE_COMMIT: ${{ needs.verify.outputs.release_commit }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if [[ -z "${NODE_AUTH_TOKEN}" ]]; then
            echo "::error::NPM_KEY is not configured in the npm environment."
            exit 1
          fi
          node scripts/ci/publish-npm-release.mjs release-package/*.tgz

      - name: Record the published source commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.verify.outputs.release_commit }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          bash scripts/ci/create-release-tag.sh --tag "${RELEASE_TAG}" --commit "${RELEASE_COMMIT}" --push
          bash scripts/ci/upsert-github-release.sh --tag "${RELEASE_TAG}" --commit "${RELEASE_COMMIT}" --package-name @lovelace_lol/embody --package-version "${RELEASE_VERSION}"

  record-publication:
    name: Record the published package
    needs: [verify, publish-npm]
    # This job only writes data. The main-only workflow_run receiver owns the
    # dispatch credential, including for same-repository PRs.
    if: always() && needs.verify.result == 'success' && (needs.verify.outputs.stable_release == 'false' || needs.publish-npm.result == 'success') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          # This helper only writes data and receives no npm/dispatch secrets.
          # Use its current contract even when an older preview ref is built.
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Write publication data
        env:
          PUBLICATION_CHANNEL: ${{ needs.verify.outputs.stable_release == 'true' && 'stable' || 'preview' }}
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          PACKAGE_VERSION: ${{ needs.verify.outputs.version }}
          UPSTREAM_PR: ${{ github.event.pull_request.number || inputs.upstream_pr || github.event.client_payload.upstream_pr || '' }}
          PUBLICATION_FILE: ${{ runner.temp }}/package-publication.json
        run: node scripts/ci/write-package-publication.mjs

      - name: Upload publication data for the trusted receiver
        uses: actions/upload-artifact@v4
        with:
          name: package-publication-${{ github.run_attempt }}
          path: ${{ runner.temp }}/package-publication.json
          if-no-files-found: error
          retention-days: 7
