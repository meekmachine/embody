name: Publish (pkg.pr.new)

# Built package distribution for private consumers. Depends-on / PR tests use
# git SHAs. This workflow publishes on main and on-demand for staging/prod deploys.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref or SHA to publish (default: current ref)
        required: false
        type: string
        default: ""
  repository_dispatch:
    types: [publish-pkg-pr-new]

concurrency:
  group: pkg-pr-new-${{ github.event.client_payload.sha || github.event.inputs.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve checkout ref
        id: ref
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            ref="${{ github.event.client_payload.sha }}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.ref }}" ]]; then
            ref="${{ github.event.inputs.ref }}"
          else
            ref="${{ github.sha }}"
          fi
          if [[ -z "${ref}" ]]; then
            echo "Missing publish ref/sha" >&2
            exit 1
          fi
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish package to pkg.pr.new
        id: publish
        continue-on-error: true
        run: npx --yes pkg-pr-new publish --no-compact

      - name: Fail if pkg.pr.new is unavailable
        if: steps.publish.outcome == 'failure'
        run: |
          echo "::error::pkg.pr.new publish failed. Reinstall the GitHub App at https://github.com/apps/pkg-pr-new on meekmachine/embody, then re-run."
          exit 1
